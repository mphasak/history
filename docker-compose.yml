services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_USER: history_sim
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: history_sim
    ports:
      - "5433:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U history_sim -d history_sim"]
      interval: 5s
      timeout: 5s
      retries: 10

  ingest:
    build:
      context: ./ingest
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DSN: postgresql://history_sim:dev@postgres:5432/history_sim
    volumes:
      - ./ingest:/app
      - ./template_v0.3.xlsx:/app/template_v0.3.xlsx:ro
    command: python ingest.py template_v0.3.xlsx --dsn postgresql://history_sim:dev@postgres:5432/history_sim
    restart: "no"

  # Applies hand-authored paleo feature snapshots after ingest.
  # Idempotent (DELETE+INSERT keyed on PF_PALEO_* IDs); runs every compose up
  # so existing pgdata volumes pick up updates to db/003_seed_paleo_features.sql
  # without requiring `docker compose down -v`.
  paleo-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/003_seed_paleo_features.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Seeds Reich-style population genetics data (ancestry components and
  # Pleistocene/Holocene carriers). Idempotent like paleo-seed.
  genetics-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      paleo-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/004_seed_population_genetics.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Seeds non-sapiens hominins, additional UP clusters, and Holocene/historical
  # ethnolinguistic carriers — i.e. fills the population coverage gaps left by
  # the spreadsheet and the genetics seed. Idempotent (DELETE+INSERT keyed on
  # CARR_HIST_* / CARR_HOMININ_* prefixes).
  carriers-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      paleo-seed:
        condition: service_completed_successfully
      genetics-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/005_seed_historical_carriers.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Territory snapshots: per-year extent polygons for major carriers
  # (Roman Empire growth/peak/decline, Mongol peak, Bay Area counties, etc.).
  # The resolver prefers the latest snapshot at-or-before the queried year
  # over the carrier-type buffer fallback, so fill-mode rendering tracks
  # actual territorial evolution.
  territory-snapshots-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      carriers-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/009_carrier_territory_snapshots.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Historical places: era-appropriate city/region labels for the
  # "Historical" label mode. Adds the historical_place table additively.
  # Idempotent (DELETE keyed on the HP_* id prefix).
  historical-places-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/008_historical_places.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Threats for the Holocene gap-filler carriers from 010 plus the older
  # forager/Mesolithic carriers. Without these, clicking Cucuteni-Trypillia
  # / Predynastic Egyptian / Yangshao / etc. shows no Threats section.
  # Must run AFTER carrier-threats-seed since both share the [AUTO-THREAT]
  # idempotency tag.
  holocene-threats-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      carriers-seed:
        condition: service_completed_successfully
      holocene-carriers-seed:
        condition: service_completed_successfully
      carrier-threats-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/011_holocene_carrier_threats.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Threats: per-carrier threat windows + cited claims (climate, war, disease,
  # colonization, etc.). Adds the carrier_threat table + threat_type enum
  # additively (not in 001_schema.sql; this file is the canonical source for
  # the table). Idempotent (DELETE keyed on [AUTO-THREAT] statement prefix
  # and a carrier_id allow-list).
  carrier-threats-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      paleo-seed:
        condition: service_completed_successfully
      genetics-seed:
        condition: service_completed_successfully
      carriers-seed:
        condition: service_completed_successfully
      carriers-provenance-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/007_carrier_threats.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Forager / aceramic-Neolithic carriers — fills the Mesolithic /
  # Pre-Pottery-Neolithic / Archaic-period regional coverage gap so a
  # screenshot at e.g. 11 kya shows ~30 dots globally instead of ~10.
  # Must run after carriers-seed so the CARR_HIST_FOR_* IDs survive 005's
  # CARR_HIST_* idempotent wipe.
  forager-carriers-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      carriers-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/012_seed_forager_carriers.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Temporal-bridge carriers (~16): fills regional date-range gaps that
  # made populations look extinct as the slider crossed certain centuries
  # (e.g. N America 600-700 CE between Hopewell and Mississippian).
  # Adds Late Woodland / Anasazi / Hohokam / Fremont (N America), Cupisnique /
  # Paracas / Amazonian formative (S America), Afanasievo / Andronovo /
  # Botai / Okunev / Karasuk / Tagar (Siberia), Colonial Mesoamerica,
  # Garamantes, Zagwe Ethiopia. CARR_HIST_BRIDGE_* prefix.
  temporal-bridge-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      carriers-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/016_seed_temporal_bridge_carriers.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Authored extent polygons for the post-Columbian carriers from 017
  # (without these the buffered 800km fallback paints them as point
  # circles instead of continental coverage).
  post-columbian-extents-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      post-columbian-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/018_seed_post_columbian_extents.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Modern continental carriers (Modern USA / Canada / Mexico) so that
  # post-WWII N America isn't a couple of regional dots.
  modern-continental-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      post-columbian-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/019_seed_modern_continental_carriers.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Post-Columbian / globalization-era carriers (~13): colonial-period
  # settlers, slave-trade-derived diaspora, and post-WWII demographic
  # synthesis populations across the Americas, Australia/NZ, southern
  # Africa, and modern Israel. CARR_HIST_POST1492_* prefix.
  post-columbian-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      carriers-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/017_seed_post_columbian_carriers.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Modern-US trait_mix backfill (Rural South + SF Bay Area). Necessary for
  # the multi-hop lineage demo: without these the BFS can't trace from
  # the modern carriers back through European Bronze Age, Mesolithic,
  # OOA, etc., to Neanderthal.
  modern-us-traitmix-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/015_seed_modern_us_trait_mixes.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Backfill trait_mix rows for the carriers from 010, 012, and 013 that
  # didn't have any (so the DetailPanel and cluster coloring don't show
  # empty bars). Editorial best-effort summaries cited via DEDUCED_PHASE_0.
  # Idempotent: keyed on the [AUTO-TRAITMIX-014] claim statement prefix.
  trait-mix-backfill-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      regional-gap-seed:
        condition: service_completed_successfully
      holocene-carriers-seed:
        condition: service_completed_successfully
      forager-carriers-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/014_seed_missing_trait_mixes.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Regional gap-fillers (~30 carriers): pre-Inca Andean (Moche/Wari/Tiwanaku),
  # post-Olmec Mesoamerica (Teotihuacan/Toltec/Zapotec/Mixtec), Caribbean
  # Taíno, Sub-Saharan medieval/early-modern (Ghana/Mali/Songhai/Great
  # Zimbabwe/Kongo/Swahili/Asante/Solomonic Ethiopia), Pacific (Lapita/
  # Polynesian/Māori/Hawaiian), Siberia/Arctic (Yakut/Chukchi/Thule), and
  # additional North American (Mississippian/Haudenosaunee/Navajo-Apache).
  # All carry [AUTO-PROVENANCE] claims citing DEDUCED_PHASE_0 (best-effort
  # editorial summaries — see 006/CLAUDE.md for the convention).
  # Must run after carriers-seed so the CARR_HIST_GAP_* IDs survive 005's
  # CARR_HIST_* idempotent wipe.
  regional-gap-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      carriers-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/013_seed_regional_gap_carriers.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Holocene gap-fillers: ~32 additional carriers covering the early-to-mid
  # Holocene (~-7000 to -1000) across all major regions so scrubbing through
  # those years doesn't show only Asia + Oceania (Halaf/Ubaid Mesopotamia,
  # Predynastic Egypt, Cucuteni-Trypillia, Yangshao/Liangzhu, Norte Chico,
  # Olmec, Pre-Classic Maya, Archaic North America, etc.).
  # Must run after carriers-seed so the CARR_HIST_HOL_* IDs survive 005's
  # CARR_HIST_* idempotent wipe.
  holocene-carriers-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      carriers-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/010_seed_holocene_carriers.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  # Provenance: ancestry breakdowns + cited claims for the carriers from 005.
  # Idempotent (DELETE keyed on the [AUTO-PROVENANCE] statement prefix and the
  # CARR_HIST_*/CARR_HOMININ_* trait-mix rows).
  carriers-provenance-seed:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      paleo-seed:
        condition: service_completed_successfully
      genetics-seed:
        condition: service_completed_successfully
      carriers-seed:
        condition: service_completed_successfully
    environment:
      PGPASSWORD: dev
    volumes:
      - ./db/006_seed_historical_carrier_ancestry.sql:/seed.sql:ro
    command: >-
      psql -h postgres -U history_sim -d history_sim -v ON_ERROR_STOP=1 -f /seed.sql
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
      paleo-seed:
        condition: service_completed_successfully
      genetics-seed:
        condition: service_completed_successfully
      carriers-seed:
        condition: service_completed_successfully
      carriers-provenance-seed:
        condition: service_completed_successfully
      carrier-threats-seed:
        condition: service_completed_successfully
      historical-places-seed:
        condition: service_completed_successfully
      territory-snapshots-seed:
        condition: service_completed_successfully
      holocene-carriers-seed:
        condition: service_completed_successfully
      holocene-threats-seed:
        condition: service_completed_successfully
      forager-carriers-seed:
        condition: service_completed_successfully
      regional-gap-seed:
        condition: service_completed_successfully
      trait-mix-backfill-seed:
        condition: service_completed_successfully
      modern-us-traitmix-seed:
        condition: service_completed_successfully
      temporal-bridge-seed:
        condition: service_completed_successfully
      post-columbian-seed:
        condition: service_completed_successfully
      post-columbian-extents-seed:
        condition: service_completed_successfully
      modern-continental-seed:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://history_sim:dev@postgres:5432/history_sim
    ports:
      - "8000:8000"
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html

volumes:
  pgdata:
